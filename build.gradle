// 根项目 build.gradle（Groovy DSL）
// ########## 核心1：buildscript 声明插件依赖（Gradle构建自身的依赖）##########
buildscript {
    // 插件仓库（必须配置，拉取Spring Boot插件）
    repositories {
        mavenLocal()
        // 第一步：优先从阿里云镜像拉取（速度快）
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 第二步：镜像未找到时，官方仓库兜底（可选）
        gradlePluginPortal()
        mavenCentral()
    }
    // 声明插件的Maven坐标（group:name:version）
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:3.5.13"
    }
}

// ########## 全局公共配置 ##########
allprojects {
    group = 'io.github.ricewines'
    version = '0.1.6'
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        mavenLocal()
        mavenCentral()
    }
}
// ########## 核心2：subprojects 中统一应用插件（无id()方法，用apply plugin）##########
subprojects {
    // 应用核心插件+Spring Boot插件（无语法冲突）
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25) // 所有子模块统一使用 Java 25
        }
    }

    // 全局版本常量+公共依赖（与之前一致）
    dependencies {
        implementation("org.springframework.boot:spring-boot-starter-freemarker")
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    // Spring Cloud 版本统一（可选）
    dependencyManagement {
        imports {
            mavenBom "org.commonmark:commonmark-parent:0.28.0"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.2"
        }
    }
    // 核心配置：启用JUnit 5平台，让Gradle识别JUnit 5的@Test注解
    tasks.test {
        useJUnitPlatform() // 必须添加，否则Gradle无法扫描JUnit 5测试用例
    }
}