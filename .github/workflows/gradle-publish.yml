# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Package

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  deploy_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: 25
          # Java distribution. See the list of supported distributions in README file
          distribution: oracle
          # ID of the distributionManagement repository in the pom.xml file. Default is `github`
          server-id: central
      - name: Publish to Maven Central
        # You may pin to the exact commit or the version.
        # uses: openMF/mifos-x-actionhub-publish-library-kmp@eea9453e8528a07eac547bdfed26c6653a912f51
        uses: openMF/mifos-x-actionhub-publish-library-kmp@v1.0.0
        with:
          # Version to publish
          version: 0.1.16
          # Maven Central username
          maven-central-username: ${{ secrets.NEXUS_USERNAME }}
          # Maven Central password or token
          maven-central-password: ${{ secrets.NEXUS_PASSWORD }}
          # GPG signing key ID
          gpg-key-id: ${{ secrets.GPG_KEY_ID }}
          # GPG signing key in ASCII-armored format
          gpg-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # GPG key passphrase
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          # GitHub token for creating releases and deploying documentation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Java version to use
          java-version: 25