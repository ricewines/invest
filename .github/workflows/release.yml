on:
  push:
    tags:
      - 'v*'
jobs:
  deploy_job:
    runs-on: ubuntu-latest
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      SERVER_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SERVER_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          server-id: central
          server-username-env-var: SERVER_USERNAME
          server-password-env-var: SERVER_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          cache: maven
      - name: Publish to Apache Maven Central
        run: mvn clean deploy -Dspring-boot.repackage.skip=true -Dgpg.arguments=--pinentry-mode,loopback