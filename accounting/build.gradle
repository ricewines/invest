buildscript {
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:4.0.6"
    }
    repositories {
        mavenLocal()
        // 第一步：优先从阿里云镜像拉取（速度快）
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 第二步：镜像未找到时，官方仓库兜底（可选）
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencies {
    // 自身业务特有依赖（如用户模块的持久层、服务层依赖）
    implementation("cn.hutool:hutool-all:5.8.44")
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough"
    implementation "org.commonmark:commonmark-ext-gfm-tables"
    implementation "org.commonmark:commonmark"
    implementation("org.jsoup:jsoup:1.22.2")
    implementation("org.slf4j:slf4j-api")
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation("org.springframework.boot:spring-boot-starter-freemarker")
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.projectlombok:lombok'
}
// Spring Cloud 版本统一（可选）
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.1"
    }
}